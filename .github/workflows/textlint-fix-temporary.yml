name: textlint-fix-temporary

on:
  push:
    branches:
      - agent/x-for-you-algorithm-blog

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/x-for-you-algorithm-blog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install packages
        run: bun install
      - name: Apply semantic fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/content/blog/x-for-you-algorithm.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "推薦システムを初めて見ると、次のような処理を想像しやすいと思います。",
                  "推薦システムを初めて見る人は、次のような処理を想像します。",
              ),
              (
                  "小さなサービスなら、これでも動くかもしれません。",
                  "小さなサービスなら、この構成でも動作します。",
              ),
              (
                  "世界中の投稿を、ユーザーが画面を開くたびに重い Transformer で採点することはできません。",
                  "世界中の投稿を、ユーザーが画面を開くたびに重い Transformer で採点できません。",
              ),
              (
                  "複数経路を持つことで、1つのモデルが見落とした候補を別の経路が拾えます。",
                  "複数経路を持つことで、1 つのモデルが見落とした候補を別の経路が拾えます。",
              ),
              (
                  "その後、プロダクト側が、\n\n```text",
                  "その後、プロダクト側が次の価値判断を下します。\n\n```text",
              ),
              (
                  "\n```\n\nを決めます。\n\nこれは**Prediction と Decision の分離**です。",
                  "\n```\n\nこれは**Prediction と Decision の分離**です。",
              ),
              (
                  "モデルを再学習しなくても、行動の価値を表す重みを変えればプロダクトの目的を調整できます。逆に、同じ行動価値のまま、予測モデルだけを改善することもできます。",
                  "モデルを再学習しなくても、行動の価値を表す重みを変えればプロダクトの目的を調整できます。逆に、同じ行動価値のまま予測モデルだけを改善できます。",
              ),
              (
                  "\nつまり、\n\n```text\n相互フォロー相手のオリジナル投稿",
                  "\n対象は次の組み合わせです。\n\n```text\n相互フォロー相手のオリジナル投稿",
              ),
              (
                  "0.75 倍は、\n\n```text",
                  "この係数は、次の 2 つを両立させる設計です。\n\n```text",
              ),
              (
                  "\n```\n\nという折衷に見えます。\n\n完全な Following",
                  "\n```\n\nこのため、フォロー外候補は不利ですが、十分に強ければフォロー内候補を追い越せます。\n\n完全な Following",
              ),
              (
                  "独立スコアだけなら 1 から 4 が上位を占めるかもしれません。",
                  "独立スコアだけなら、1 から 4 が上位を占める可能性があります。",
              ),
              (
                  "\nつまり、\n\n```text\nDPP 前",
                  "\n処理の流れは次のとおりです。\n\n```text\nDPP 前",
              ),
              (
                  "同じ投稿でも、\n\n```text\nフォロワー",
                  "同じ投稿でも、配信関係によって次の差が生じます。\n\n```text\nフォロワー",
              ),
              (
                  "そのため、\n\n```text\n安い hard filter",
                  "そのため、処理順は次の構成になっています。\n\n```text\n安い hard filter",
              ),
              (
                  "直感的には、\n\n```text\n長く見た",
                  "この処理が高く評価する候補は、次の特徴を持ちます。\n\n```text\n長く見た",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement target count must be 1, got {count}: {old!r}")
              text = text.replace(old, new)

          if "メーリングリスト" not in text:
              raise SystemExit("expected auto-corrected ML text was not found")
          text = text.replace("メーリングリスト", "機械学習")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply remaining automatic fixes
        run: bun run lint:fix || true
      - name: Validate textlint
        run: bun run lint
      - name: Validate Astro build
        run: bun run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/x-for-you-algorithm.md
          if ! git diff --cached --quiet; then
            git commit -m "記事のlintエラーと用語を修正"
            git push
          fi
