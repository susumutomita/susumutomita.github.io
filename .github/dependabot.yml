version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    ignore:
      # Astro still relies on TypeScript's JavaScript API. TypeScript 7 runs
      # separately through the @typescript/native package alias.
      - dependency-name: 'typescript'
        versions:
          - '>=7'
